version: '3.2'
services:
  listener:
    tty: true
    stdin_open: true
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://host.docker.internal:8333}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-listener}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-listener}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-listener}
    command: |
      /bin/bash -c 
      "bundle check || bundle install && 
      sleep infinity"
    build: 
      context: .
    volumes:
    - var-lib-clamav:/var/lib/clamav
    - bundle-data:/app/vendor/bundle
    - type: bind
      consistency: cached
      source: .
      target: /app/
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    environment: 
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-listener}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-listener}
    ports:
      - ${SEAWEEDFS_S3_PORT:-8333}:8333
      - 8888:8888
    volumes:
      - seaweedfs-data:/data

volumes:
  var-lib-clamav:
  bundle-data:
  seaweedfs-data:
